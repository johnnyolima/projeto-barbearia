<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navalha de Ouro | Área do cliente</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <header class="cabecalho">
    <a class="logo" href="index.html">Navalha de Ouro</a>
    <nav class="menu"><a href="index.html">Início</a><a href="servicos.html">Serviços</a><a href="produtos.html">Produtos</a><a class="ativo" href="login.html">Área do cliente</a></nav>
  </header>
  <main class="login-area">
    <form id="form-login" class="formulario">
      <p class="etiqueta">ÁREA DO CLIENTE</p>
      <h1>Entrar</h1>
      <p>Preencha os campos para acessar sua área.</p>
      <label for="usuario">Usuário ou e-mail</label>
      <input id="usuario" type="text" placeholder="Digite seu usuário">
      <label for="senha">Senha</label>
      <input id="senha" type="password" placeholder="Digite sua senha">
      <button class="botao" type="submit">Entrar</button>
      <p id="mensagem-login" class="mensagem"></p>
    </form>
  </main>
  <footer>© 2026 Navalha de Ouro · Projeto acadêmico</footer>
  <script src="js/login.js"></script>
</body>
</html>
