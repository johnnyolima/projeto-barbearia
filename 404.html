<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <base id="base-projeto" href="/" />
        <script>
            if (window.location.hostname.endsWith('github.io')) {
                document.getElementById('base-projeto').href = '/projeto-barbearia/';
            }
        </script>
        <title>Navalha de Ouro | Página não encontrada</title>
        <link rel="stylesheet" href="css/estilo.css" />
        <link rel="stylesheet" href="css/menu-hamburguer.css" />
    </head>
    <body>
        <header class="cabecalho">
            <div class="marca">
                <a
                    class="logo-navalha"
                    href="index.html"
                    aria-label="Ir para a página inicial"
                ></a>
                <a class="logo" href="index.html">Navalha de Ouro</a>
            </div>
            <input
                id="menu-hamburguer"
                class="menu-hamburguer"
                type="checkbox"
            />
            <label
                class="botao-hamburguer"
                for="menu-hamburguer"
                aria-label="Abrir menu"
            >
                <span></span><span></span><span></span>
            </label>
            <nav class="menu" aria-label="Navegação principal">
                <a href="index.html">Início</a>
                <a href="cadastro.html">Cadastro</a>
                <a id="link-entrar" href="login.html">Entrar</a>
            </nav>
            <div class="area-usuario">
                <a
                    id="usuario-logado"
                    class="usuario-logado"
                    href="painel.html"
                    aria-label="Abrir painel do cliente"
                ></a
                ><button
                    id="botao-sair"
                    class="botao-link oculto"
                    type="button"
                >
                    Sair
                </button>
            </div>
        </header>
        <div
            class="barra-acessibilidade"
            aria-label="Ferramentas de acessibilidade"
        >
            <span>Fonte:</span>
            <div class="container-fonte">
                <div class="fonte-button">
                    <button class="fonte" type="button" data-acao="diminuir-fonte">A-</button>
                </div>
                <div class="fonte-button">
                    <button class="fonte" type="button" data-acao="aumentar-fonte">A+</button>
                </div>
                <label class="tema-switch">
                    <input type="checkbox" id="tema-toggle" data-acao="alternar-tema" aria-label="Alternar tema claro ou escuro">
                    <span class="tema-slider"></span>
                    <span class="icone-lua">☾</span>
                    <span class="icone-sol">☀</span>
                </label>
            </div>
        </div>

        <main class="conteudo erro-pagina">
            <section>
                <p id="codigo-erro" class="erro-codigo">404</p>
                <h1 id="titulo-erro">Página não encontrada</h1>
                <p id="texto-erro" class="introducao">
                    O endereço acessado não existe ou foi alterado.
                </p>
                <div class="acoes acoes-centro">
                    <a class="botao" href="index.html">Voltar ao início</a
                    ><a class="botao-secundario" href="login.html"
                        >Ir para o login</a
                    >
                </div>
            </section>
        </main>

        <footer>© 2026 Navalha de Ouro</footer>
        <script src="js/dados.js"></script>
        <script src="js/comum.js"></script>
    </body>
</html>
